<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resident</title>
<link rel="icon" href="data:,">
<script>
// Follows Aelios admin's palette and theme switch, so the two pages feel like one place.
(function () {
  var saved = null;
  try { saved = localStorage.getItem('resident.theme'); } catch (e) {}
  var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg-deep: #070a16;
    --panel-bg: rgba(21, 27, 54, .62);
    --panel-bg-strong: rgba(23, 29, 58, .92);
    --panel-border: rgba(148, 163, 255, .16);
    --panel-glow: 0 1px 0 rgba(180, 190, 255, .07) inset, 0 10px 30px rgba(2, 5, 18, .5);
    --mine-bg: rgba(244, 160, 124, .16);
    --mine-border: rgba(244, 160, 124, .35);
    --text-1: #eef0ff;
    --text-2: #c9cdea;
    --text-3: #9aa0c8;
    --text-4: #6d7299;
    --on-accent: #251304;
    --coral: #F4A07C;
    --violet: #8b7cf6;
    --cyan: #67e8f9;
    --err: #f87171;
    --nebula-1: rgba(124, 93, 250, .13);
    --nebula-2: rgba(56, 189, 248, .09);
    --star-1: rgba(255, 255, 255, .85);
    --star-2: rgba(190, 205, 255, .7);
    --star-3: rgba(244, 160, 124, .55);
    --stars-opacity: .9;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg-deep: #eceef8;
    --panel-bg: rgba(255, 255, 255, .66);
    --panel-bg-strong: rgba(252, 252, 255, .94);
    --panel-border: rgba(109, 92, 210, .18);
    --panel-glow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 10px 26px rgba(88, 76, 160, .12);
    --mine-bg: rgba(244, 160, 124, .22);
    --mine-border: rgba(214, 120, 84, .35);
    --text-1: #232437;
    --text-2: #3c3e5c;
    --text-3: #60638a;
    --text-4: #888cb2;
    --on-accent: #2a1608;
    --nebula-1: rgba(244, 160, 124, .22);
    --nebula-2: rgba(139, 124, 246, .16);
    --star-1: rgba(124, 108, 220, .5);
    --star-2: rgba(244, 160, 124, .5);
    --star-3: rgba(103, 180, 249, .45);
    --stars-opacity: .5;
  }
  [x-cloak] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-deep); color: var(--text-1); }
  body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--bg-deep); }
  .starfield::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(58% 42% at 76% 10%, var(--nebula-1), transparent 72%), radial-gradient(52% 42% at 10% 82%, var(--nebula-2), transparent 72%); }
  .starfield::after { content: ""; position: absolute; inset: 0; opacity: var(--stars-opacity); background-size: 420px 420px;
    background-image:
      radial-gradient(1px 1px at 24px 36px, var(--star-1), transparent),
      radial-gradient(1px 1px at 128px 96px, var(--star-2), transparent),
      radial-gradient(1.5px 1.5px at 212px 180px, var(--star-1), transparent),
      radial-gradient(1px 1px at 320px 64px, var(--star-2), transparent),
      radial-gradient(1px 1px at 392px 240px, var(--star-3), transparent),
      radial-gradient(1px 1px at 72px 300px, var(--star-2), transparent),
      radial-gradient(1.5px 1.5px at 268px 356px, var(--star-1), transparent); }

  .shell { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-4); }
  .spacer { flex: 1; }
  .icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; border: 1px solid var(--panel-border);
    background: var(--panel-bg); color: var(--text-3); cursor: pointer; }
  .icon-btn:hover { color: var(--text-1); border-color: var(--coral); }
  .icon-btn svg { width: 18px; height: 18px; }

  .stream { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; color: var(--text-3); font-size: 14px; text-align: center; }
  .row { display: flex; flex-direction: column; gap: 4px; max-width: 82%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 9px 13px; border-radius: 18px; border: 1px solid var(--panel-border); background: var(--panel-bg);
    box-shadow: var(--panel-glow); backdrop-filter: blur(8px); white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .row.user .bubble { background: var(--mine-bg); border-color: var(--mine-border); border-bottom-right-radius: 6px; }
  .row.assistant .bubble:last-of-type { border-bottom-left-radius: 6px; }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-4); padding: 0 4px; }
  .badge { border: 1px solid var(--panel-border); border-radius: 999px; padding: 0 7px; }
  .heart { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 10px; border: 0; background: transparent;
    color: var(--text-4); cursor: pointer; }
  .heart:hover, .heart.done { color: var(--coral); }
  .heart svg { width: 15px; height: 15px; }

  .letter { align-self: stretch; border: 1px dashed var(--panel-border); border-radius: 18px; padding: 10px 14px; background: var(--panel-bg); font-size: 13px; color: var(--text-3); }
  .letter summary { cursor: pointer; color: var(--text-2); }
  .letter p { white-space: pre-wrap; margin: 8px 0 0; color: var(--text-2); }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 13px 15px; border-radius: 18px; background: var(--panel-bg); border: 1px solid var(--panel-border); }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .composer textarea { flex: 1; min-height: 44px; max-height: 40vh; resize: none; padding: 10px 14px; border-radius: 18px;
    border: 1px solid var(--panel-border); background: var(--panel-bg-strong); outline: none; font-size: 16px; line-height: 1.5; }
  .composer textarea:focus { border-color: var(--coral); }
  .send { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 16px; border: 0; background: var(--coral); color: var(--on-accent); cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .send svg { width: 18px; height: 18px; }

  .login { margin: auto; width: min(360px, calc(100% - 32px)); padding: 22px; border-radius: 22px; border: 1px solid var(--panel-border);
    background: var(--panel-bg-strong); box-shadow: var(--panel-glow); }
  .login h1 { margin: 0 0 4px; font-size: 18px; }
  .login p { margin: 0 0 14px; font-size: 13px; color: var(--text-3); }
  .login input { width: 100%; height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--panel-border); background: var(--bg-deep); outline: none; }
  .login input:focus { border-color: var(--coral); }
  .login button { margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 14px; background: var(--coral); color: var(--on-accent); font-weight: 600; cursor: pointer; }
  .error { margin-top: 10px; font-size: 13px; color: var(--err); }
  .nudge { align-self: center; padding: 6px 12px; border-radius: 14px; border: 1px dashed var(--panel-border); background: var(--panel-bg);
    font-size: 13px; color: var(--text-3); cursor: pointer; }
  .nudge:hover { color: var(--text-1); border-color: var(--coral); }

  .persona { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding: 4px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .persona .hint { margin: 0; font-size: 13px; color: var(--text-3); }
  .persona textarea { flex: 1; min-height: 45vh; resize: vertical; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--panel-border);
    background: var(--panel-bg-strong); outline: none; font-size: 15px; line-height: 1.6; }
  .persona textarea:focus { border-color: var(--coral); }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .count { font-size: 12px; color: var(--text-4); }
  .warn { margin: 0; font-size: 13px; color: var(--coral); }
  .btn { height: 40px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--panel-border); background: var(--panel-bg); cursor: pointer; }
  .btn:hover { border-color: var(--coral); }
  .btn.primary { border: 0; background: var(--coral); color: var(--on-accent); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  .versions { font-size: 13px; color: var(--text-3); }
  .versions summary { cursor: pointer; }
  .version { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--panel-border); }
  .version .when { flex: none; color: var(--text-4); font-size: 12px; }
  .version .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .version .btn { height: 32px; padding: 0 10px; font-size: 13px; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 5; padding: 8px 14px; border-radius: 12px;
    background: var(--panel-bg-strong); border: 1px solid var(--panel-border); font-size: 13px; color: var(--text-2); }
</style>
</head>
<body>
<div class="starfield"></div>
<div class="shell" x-data="resident()" x-init="start()" x-cloak>

  <template x-if="!authed">
    <form class="login" @submit.prevent="login()">
      <h1>住户的网页门</h1>
      <p>填 Worker 里设的 WEB_KEY。只存在这台设备的浏览器里。</p>
      <input x-model="keyInput" type="password" autocomplete="current-password" placeholder="网页钥匙" aria-label="网页钥匙">
      <button type="submit">进门</button>
      <div class="error" x-show="loginError" x-text="loginError"></div>
    </form>
  </template>

  <template x-if="authed">
    <div style="display:contents">
      <header>
        <button class="icon-btn" type="button" x-show="view === 'persona'" @click="closePersona()" aria-label="回到聊天" title="回到聊天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div>
          <h1 x-text="view === 'persona' ? '人设' : '住户'"></h1>
          <div class="sub" x-text="view === 'persona' ? '改完下一句就按新的说' : '跟 Telegram 是同一段对话'"></div>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" type="button" x-show="view === 'chat'" @click="openPersona()" aria-label="人设" title="人设">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </button>
        <button class="icon-btn" type="button" @click="toggleTheme()" :aria-label="theme === 'dark' ? '切到白天' : '切到夜间'" :title="theme === 'dark' ? '切到白天' : '切到夜间'">
          <svg x-show="theme === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg x-show="theme !== 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" type="button" @click="logout()" aria-label="锁上" title="锁上">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </header>

      <main class="stream" x-show="view === 'chat'" @scroll="nearBottom = isNearBottom()">
        <button class="nudge" type="button" x-show="personaLoaded && !persona.text" @click="openPersona()">还没填人设，现在用的是默认的一句。点这里填</button>
        <div class="empty" x-show="!lines.length && !sending">还没有聊天。说句话吧，Telegram 那边也看得到。</div>
        <template x-for="line in lines" :key="line.id">
          <div style="display:contents">
            <template x-if="line.kind === 'letter'">
              <details class="letter">
                <summary>更早的聊天收进了一封交接信</summary>
                <p x-text="line.text"></p>
              </details>
            </template>
            <template x-if="line.kind === 'chat'">
              <div class="row" :class="line.role">
                <template x-for="(bubble, index) in bubbles(line)" :key="index">
                  <div class="bubble" x-text="bubble"></div>
                </template>
                <div class="meta">
                  <span x-show="line.at" x-text="fmt(line.at)"></span>
                  <span class="badge" x-show="line.via" x-text="viaLabel(line.via)"></span>
                  <button class="heart" type="button" x-show="aelios && !line.pending" :class="pinned[line.id] ? 'done' : ''" @click="pin(line)" aria-label="存进珍贵" title="存进 Aelios 的珍贵">
                    <svg viewBox="0 0 24 24" :fill="pinned[line.id] ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </template>
        <div class="typing" x-show="sending" aria-label="正在输入"><i></i><i></i><i></i></div>
      </main>

      <section class="persona" x-show="view === 'persona'">
        <p class="hint">它是谁、怎么叫你、说话什么样，都写在这里。只存在你自己的 Worker 里，不进代码仓库。留空保存就回到默认的一句。</p>
        <textarea x-model="personaDraft" :maxlength="PERSONA_MAX" :placeholder="'没填时用的是：' + persona.fallback" aria-label="人设"></textarea>
        <p class="warn" x-show="/claude\s*code/i.test(personaDraft)">用 Max 附带的 API key 时，人设里有「Claude Code」这几个字会报错，换个说法。</p>
        <div class="bar">
          <span class="count" x-text="personaDraft.trim().length + ' / ' + PERSONA_MAX + ' 字'"></span>
          <span class="count" x-show="persona.at" x-text="'上次改：' + fmt(persona.at)"></span>
          <div class="spacer"></div>
          <button class="btn" type="button" @click="closePersona()">返回</button>
          <button class="btn primary" type="button" @click="savePersona()" :disabled="savingPersona || !personaDirty">保存</button>
        </div>
        <details class="versions" x-show="persona.versions.length">
          <summary x-text="'之前的版本（' + persona.versions.length + '）'"></summary>
          <template x-for="version in persona.versions" :key="version.at">
            <div class="version">
              <span class="when" x-text="fmt(version.at)"></span>
              <span class="text" x-text="version.text"></span>
              <button class="btn" type="button" @click="personaDraft = version.text">放回去</button>
            </div>
          </template>
        </details>
      </section>

      <form class="composer" x-show="view === 'chat'" @submit.prevent="send()">
        <textarea x-model="draft" rows="1" placeholder="说点什么" aria-label="消息"
          @input="grow()" @keydown.enter="if (!$event.shiftKey && !$event.isComposing && $event.keyCode !== 229) { $event.preventDefault(); send(); }"></textarea>
        <button class="send" type="submit" :disabled="sending || !draft.trim()" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
    </div>
  </template>

  <div class="toast" x-show="toast" x-text="toast" x-transition.opacity></div>
</div>

<script>
function resident() {
  var POLL_MS = 5000;
  var PERSONA_MAX = 30000;
  function readKey() { try { return localStorage.getItem('resident.key') || ''; } catch (e) { return ''; } }
  function writeKey(value) { try { value ? localStorage.setItem('resident.key', value) : localStorage.removeItem('resident.key'); } catch (e) {} }
  return {
    key: readKey(),
    keyInput: '',
    authed: false,
    loginError: '',
    aelios: false,
    lines: [],
    pinned: {},
    draft: '',
    sending: false,
    nearBottom: true,
    toast: '',
    theme: document.documentElement.dataset.theme,
    timer: null,
    view: 'chat',
    PERSONA_MAX: PERSONA_MAX,
    persona: { text: '', at: null, fallback: '', versions: [] },
    personaLoaded: false,
    personaDraft: '',
    savingPersona: false,

    get personaDirty() { return this.personaDraft.trim() !== this.persona.text; },

    async start() {
      if (this.key) await this.check(this.key);
      var self = this;
      document.addEventListener('visibilitychange', function () { if (!document.hidden && self.authed) self.refresh(); });
    },
    async api(path, options) {
      var opts = options || {};
      var headers = { 'x-web-key': this.key };
      if (opts.body) headers['content-type'] = 'application/json';
      var response = await fetch(path, { method: opts.method || 'GET', headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (response.status === 401) { this.authed = false; throw new Error('钥匙不对'); }
      if (!response.ok) {
        var problem = await response.json().catch(function () { return {}; });
        throw new Error(problem.error || '出错了（' + response.status + '）');
      }
      return response.json();
    },
    async check(key) {
      this.key = key;
      try {
        var data = await this.api('/web/check');
        this.authed = true;
        this.aelios = Boolean(data.aelios);
        writeKey(key);
        this.loadPersona().catch(function () {});
        await this.refresh(true);
        this.poll();
      } catch (error) {
        this.authed = false;
        this.loginError = error.message;
      }
    },
    login() {
      this.loginError = '';
      if (this.keyInput.trim()) this.check(this.keyInput.trim());
    },
    logout() {
      writeKey('');
      this.key = '';
      this.keyInput = '';
      this.authed = false;
      this.lines = [];
      this.view = 'chat';
      this.personaLoaded = false;
      clearTimeout(this.timer);
    },
    poll() {
      var self = this;
      clearTimeout(this.timer);
      this.timer = setTimeout(async function () {
        if (self.authed && !document.hidden && !self.sending) await self.refresh().catch(function () {});
        if (self.authed) self.poll();
      }, POLL_MS);
    },
    async refresh(scroll) {
      var data = await this.api('/web/messages');
      var next = data.data || [];
      var changed = next.length !== this.lines.length || (next.length && next[next.length - 1].id !== this.lines[this.lines.length - 1].id);
      var stick = scroll || this.isNearBottom();
      this.lines = next;
      if (changed && stick) this.scrollSoon();
    },
    async send() {
      var text = this.draft.trim();
      if (!text || this.sending) return;
      this.sending = true;
      this.draft = '';
      this.$nextTick(() => this.grow());
      this.lines = this.lines.concat([{ id: 'pending-' + Date.now(), role: 'user', kind: 'chat', text: text, at: Date.now(), via: 'web', pending: true }]);
      this.scrollSoon();
      try {
        var result = await this.api('/web/say', { method: 'POST', body: { text: text } });
        if (result.status !== 'completed') this.notify('这句没回出来（' + result.status + '）');
      } catch (error) {
        this.notify(error.message);
      } finally {
        this.sending = false;
        await this.refresh(true).catch(() => {});
        var input = document.querySelector('.composer textarea');
        if (input) input.focus();
      }
    },
    async pin(line) {
      if (this.pinned[line.id]) return;
      try {
        var result = await this.api('/web/pin', { method: 'POST', body: { text: line.text } });
        if (!result.ok) throw new Error('没存上');
        this.pinned[line.id] = true;
        this.notify('已存进珍贵');
      } catch (error) {
        this.notify(error.message);
      }
    },
    async loadPersona() {
      this.persona = await this.api('/web/persona');
      this.personaLoaded = true;
    },
    async openPersona() {
      try {
        await this.loadPersona();
      } catch (error) {
        this.notify(error.message);
        return;
      }
      this.personaDraft = this.persona.text;
      this.view = 'persona';
      this.$nextTick(function () {
        var el = document.querySelector('.persona textarea');
        if (el) el.focus();
      });
    },
    closePersona() {
      if (this.personaDirty && !confirm('改的还没保存，不要了吗？')) return;
      this.view = 'chat';
      this.scrollSoon();
    },
    async savePersona() {
      if (this.savingPersona) return;
      this.savingPersona = true;
      try {
        this.persona = await this.api('/web/persona', { method: 'POST', body: { text: this.personaDraft } });
        this.personaDraft = this.persona.text;
        this.notify(this.persona.text ? '人设存好了，下一句就按这个说' : '清空了，先用默认的一句');
        this.view = 'chat';
        this.scrollSoon();
      } catch (error) {
        this.notify(error.message);
      } finally {
        this.savingPersona = false;
      }
    },
    bubbles(line) {
      if (line.role !== 'assistant') return [line.text];
      return line.text.split(/\n[^\S\n]*\n\s*/).filter(function (part) { return part.trim(); });
    },
    viaLabel(via) {
      return { telegram: 'Telegram', web: '网页', checkin: '主动找你' }[via] || '';
    },
    fmt(at) {
      var date = new Date(at);
      var now = new Date();
      var time = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
      if (date.toDateString() === now.toDateString()) return time;
      return (date.getMonth() + 1) + '-' + date.getDate() + ' ' + time;
    },
    grow() {
      var el = document.querySelector('.composer textarea');
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    },
    // Elements inside x-if templates are looked up directly: $refs there are not ready on first render.
    isNearBottom() {
      var el = document.querySelector('.stream');
      return !el || el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    },
    toBottom() {
      var el = document.querySelector('.stream');
      if (el) el.scrollTop = el.scrollHeight;
    },
    scrollSoon() {
      var self = this;
      this.$nextTick(function () {
        requestAnimationFrame(function () { self.toBottom(); });
        setTimeout(function () { self.toBottom(); }, 150);
      });
    },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = this.theme;
      try { localStorage.setItem('resident.theme', this.theme); } catch (e) {}
    },
    notify(message) {
      var self = this;
      this.toast = message;
      setTimeout(function () { if (self.toast === message) self.toast = ''; }, 2400);
    }
  };
}
</script>
</body>
</html>
